<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laufband Test</title>
<style>
  :root {
    --bg: #111418; --card: #1c2128; --line: #2c333d; --text: #e8ecf1; --muted: #8b95a3;
    --accent: #2bb3c0; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, sans-serif; padding: 16px; padding-bottom: 60px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 14px; background: #2c333d; color: var(--text); }
  button.primary { background: var(--accent); color: #041014; font-weight: 600; }
  button.danger { background: var(--bad); color: #fff; font-weight: 600; }
  button:disabled { opacity: .4; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: #14181d; border-radius: 10px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }
  #status { font-size: 14px; color: var(--muted); margin-top: 8px; }
  input[type=text], select { width: 100%; font: 15px ui-monospace, Menlo, monospace; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #14181d; color: var(--text); }
  label { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #log { width: 100%; height: 260px; font: 11px/1.35 ui-monospace, Menlo, monospace; background: #0b0d10; color: #c9d1d9; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  #probeInfo { font: 13px ui-monospace, Menlo, monospace; margin: 8px 0; min-height: 2.6em; }
  .hit { color: var(--ok); font-weight: 700; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
</style>
</head>
<body>
<h1>Laufband-Test (MAXFREE)</h1>

<div class="card">
  <div class="row">
    <button id="btnConnect" class="primary">Verbinden</button>
    <button id="btnDisconnect" disabled>Trennen</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="btnConnectAll">Verbinden (alle Geräte zeigen)</button>
  </div>
  <div id="status">Nicht verbunden</div>
  <div id="env" class="hint"></div>
</div>

<div class="card">
  <h2>Live</h2>
  <div class="stats">
    <div class="stat"><b id="vSt">–</b><span>Zustand</span></div>
    <div class="stat"><b id="vP">–</b><span>km/h</span></div>
    <div class="stat"><b id="vT">–</b><span>Zeit</span></div>
    <div class="stat"><b id="vDis">–</b><span>km</span></div>
    <div class="stat"><b id="vCa">–</b><span>kcal</span></div>
    <div class="stat"><b id="vMisc" style="font-size:13px">–</b><span>Sonstiges</span></div>
  </div>
</div>

<div class="card">
  <h2>Automatischer Test</h2>
  <select id="probeMode">
    <option value="start">1. Start-Befehl suchen (Band muss stehen)</option>
    <option value="stop">2. Stopp-Befehl suchen (Band muss laufen)</option>
    <option value="speed">3. Tempo-Befehl suchen (Band muss laufen, ~1 km/h)</option>
    <option value="binary">4. Binäre Protokolle anderer Hersteller (19 Tests)</option>
    <option value="header">5. Andere Kopfkennungen statt EE (~120 Tests)</option>
    <option value="sweep">6. Alle 256 Prüfsummen für Eingabe unter „Manuell“ (Standard st20)</option>
  </select>
  <label style="margin-top:8px">Ab Nr. <input id="probeFrom" type="number" min="1" value="1" style="width:90px;font:15px ui-monospace,Menlo,monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:#14181d;color:var(--text)"></label>
  <div id="probeInfo">Bereit.</div>
  <div class="row">
    <button id="btnProbe" class="primary" disabled>Test starten</button>
    <button id="btnProbePause" disabled>Pause</button>
  </div>
  <p class="hint">Niemand auf dem Band! Der Test hält automatisch an, sobald das Band reagiert.</p>
</div>

<div class="card">
  <h2>Manuell senden</h2>
  <input id="manual" type="text" placeholder="z. B. st30" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="row" style="margin-top:8px">
    <label><input type="radio" name="wrap" value="frame" checked> EE,…,Prüfsumme,FF</label>
    <label><input type="radio" name="wrap" value="raw"> roh (Text)</label>
    <label><input type="radio" name="wrap" value="hex"> Hex</label>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="btnSend" disabled>Senden</button>
  </div>
</div>

<div class="card">
  <h2>Protokoll</h2>
  <textarea id="log" readonly></textarea>
  <div class="row" style="margin-top:8px">
    <button id="btnCopy">Protokoll kopieren</button>
    <button id="btnClear">Leeren</button>
  </div>
</div>

<script>
const uuid16 = n => `0000${n}-0000-1000-8000-00805f9b34fb`;
const SVC = uuid16('ffe0'), CH1 = uuid16('ffe1'), CH2 = uuid16('ffe2');
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();

let device, ch1, ch2;
let rxBuf = '';
let last = null;          // zuletzt empfangener Status (Objekt)
let lastRaw = '';
let extraMsgs = [];
let lastGood = null; // letzte fehlerfreie Meldung (Vorlage für volle Statuszeilen)
const hist = [];  // letzte Statusmeldungen, um verstümmelte Einzelmeldungen auszufiltern       // Meldungen, die nicht ins Statusformat passen

// ---------- Protokoll ----------
function errStr(e) {
  if (e == null) return String(e);
  if (typeof e === 'string') return e;
  const parts = [e.name, e.message, e.code].filter(x => x !== undefined && x !== '');
  if (parts.length) return parts.join(' / ');
  try { return JSON.stringify(e) + ' ' + String(e); } catch { return String(e); }
}
function ts() { return new Date().toTimeString().slice(0, 8); }
function log(msg) {
  const el = $('log');
  el.value += `[${ts()}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

// ---------- Format ----------
function digitSum(s) { let n = 0; for (const c of s) if (c >= '0' && c <= '9') n += +c; return n; }
// Echte Prüfsumme (an allen Meldungen geprüft, auch über 10 Minuten Laufzeit):
// ASCII-Werte aller Ziffern addieren (Ziffern im s-Feld zählen wie '0'), minus 101, modulo 256, dreistellig.
function csReal(fields) {
  let t = 0;
  for (const f of fields) {
    const key = (f.match(/^[a-z]+/i) || [''])[0];
    for (const ch of f) if (ch >= '0' && ch <= '9') t += key === 's' ? 48 : ch.charCodeAt(0);
  }
  return String((((t - 101) % 256) + 256) % 256).padStart(3, '0');
}
function frame(payload) { return `EE,${payload},${csReal(payload.split(','))},FF`; }
function parseStatus(txt) {
  const parts = txt.split(',');
  if (parts[0] !== 'EE' || parts[parts.length - 1] !== 'FF') return null;
  const o = { _cs: parts[parts.length - 2] };
  for (const p of parts.slice(1, -2)) {
    const m = p.match(/^([a-z]+)(.*)$/i);
    if (m) o[m[1]] = m[2];
  }
  return o;
}
function hexOf(bytes) { return [...bytes].map(b => b.toString(16).padStart(2, '0')).join(' '); }

// ---------- Empfang ----------
// Statusmeldungen können auf FFE1 oder FFE2 ankommen (Bluefy meldet sie auf FFE2) – beide gleich behandeln.
const rxBufs = { FFE1: '', FFE2: '' };
let lastRawSeen = '', lastRawAt = 0;
function onData(which, ev) {
  const dv = ev.target.value;
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset || 0, dv.byteLength);
  const txt = dec.decode(bytes);
  if (!/^[\x20-\x7e\r\n]*$/.test(txt)) {
    log(`<< ${which} [hex] ${hexOf(bytes)}`);
    extraMsgs.push(txt);
    return;
  }
  rxBufs[which] += txt;
  let m;
  while ((m = rxBufs[which].match(/EE,[^]*?,FF/))) {
    const before = rxBufs[which].slice(0, m.index).trim();
    if (before) { log(`<< ${which} (anderes) "${before}"`); extraMsgs.push(before); }
    rxBufs[which] = rxBufs[which].slice(m.index + m[0].length);
    // gleiche Meldung kurz hintereinander (doppelt zugestellt) nur einmal verarbeiten
    const now = Date.now();
    if (m[0] === lastRawSeen && now - lastRawAt < 700) continue;
    lastRawSeen = m[0]; lastRawAt = now;
    handleStatus(m[0], which);
  }
  if (rxBufs[which].length > 300) { log(`<< ${which} (anderes) "${rxBufs[which]}"`); extraMsgs.push(rxBufs[which]); rxBufs[which] = ''; }
}

function handleStatus(raw, which) {
  const s = parseStatus(raw);
  if (!s) { log(`<< ? ${raw}`); extraMsgs.push(raw); return; }
  const prev = last;
  last = s;
  hist.push(s); if (hist.length > 5) hist.shift();
  // Nur Änderungen loggen, die nicht ohnehin laufend passieren (Zeit/Strecke/Kalorien/Prüfsumme)
  const keys = Object.keys(s).filter(k => !['t', 'dis', 'ca', '_cs'].includes(k));
  const changed = !prev || keys.some(k => prev[k] !== s[k]);
  if (changed) log(`<< ${which}: ${raw}`);
  const body = raw.split(',').slice(1, -2);
  const shapeOk = /^EE,c\d+,sf\d+,st\d+,mp\d+\.\d,ms\d+,mi\d+\.\d,ca\d+,dis\d+\.\d\d,h\d+,s\d+,p\d+\.\d,t\d+\.\d\d,\d+,FF$/.test(raw);
  if (s._cs === csReal(body) && shapeOk) lastGood = s;
  else log(`!! fehlerhafte Meldung (Prüfsumme erwartet ${csReal(body)}): ${raw}`);
  lastRaw = raw;
  const stName = { '10': 'steht', '20': 'läuft', '30': 'startet' }[s.st] || ('st' + s.st);
  $('vSt').textContent = stName;
  $('vP').textContent = s.p ?? '–';
  $('vT').textContent = (s.t ?? '–').replace('.', ':');
  $('vDis').textContent = s.dis ?? '–';
  $('vCa').textContent = s.ca ?? '–';
  $('vMisc').textContent = `c${s.c} sf${s.sf} h${s.h} s${s.s}`;
}

// ---------- Verbindung ----------
const h1 = e => onData('FFE1', e), h2 = e => onData('FFE2', e);
async function connect(showAll) {
  try {
    if (!navigator.bluetooth) { alert('Kein Web Bluetooth. Bitte die Seite in der App "Bluefy" öffnen.'); return; }
    $('status').textContent = 'Geräteauswahl geöffnet …';
    device = await navigator.bluetooth.requestDevice(showAll
      ? { acceptAllDevices: true, optionalServices: [SVC] }
      : { filters: [{ namePrefix: 'MAXFREE' }, { services: [SVC] }], optionalServices: [SVC] });
    device.addEventListener('gattserverdisconnected', () => {
      $('status').textContent = 'Verbindung getrennt';
      log('-- Verbindung getrennt');
      setUi(false);
      probe.running = false;
    });
    log('-- gewählt: ' + (device.name || device.id));
    $('status').textContent = 'Verbinde …';
    const server = await device.gatt.connect();
    log('-- GATT verbunden');
    const svc = await server.getPrimaryService(SVC);
    log('-- Service FFE0 gefunden');
    ch1 = await svc.getCharacteristic(CH1);
    ch1.oncharacteristicvaluechanged = null;
    ch1.removeEventListener('characteristicvaluechanged', h1);
    ch1.addEventListener('characteristicvaluechanged', h1);
    await ch1.startNotifications();
    log('-- FFE1 abonniert');
    try {
      ch2 = await svc.getCharacteristic(CH2);
      ch2.removeEventListener('characteristicvaluechanged', h2);
      ch2.addEventListener('characteristicvaluechanged', h2);
      await ch2.startNotifications();
      log('-- FFE2 abonniert');
    } catch (e) { log('FFE2 nicht abonniert: ' + errStr(e)); }
    $('status').textContent = 'Verbunden mit ' + (device.name || 'Laufband');
    log('-- verbunden: ' + device.name);
    setUi(true);
  } catch (e) {
    $('status').textContent = 'Fehler: ' + errStr(e);
    log('!! Verbinden: ' + errStr(e));
  }
}
function setUi(on) {
  $('btnConnect').disabled = on;
  $('btnDisconnect').disabled = !on;
  $('btnSend').disabled = !on;
  $('btnProbe').disabled = !on;
  $('btnProbePause').disabled = !on;
}

async function sendBytes(bytes, label) {
  log(`>> ${label}`);
  try {
    if (ch1.writeValueWithResponse) await ch1.writeValueWithResponse(bytes);
    else await ch1.writeValue(bytes);
  } catch (e) {
    log('!! Schreiben fehlgeschlagen: ' + errStr(e));
  }
}
async function sendText(txt) { await sendBytes(enc.encode(txt), JSON.stringify(txt)); }

// ---------- Kandidaten ----------
// Volle Statuszeile mit geänderten Feldern zurückschicken (manche Platinen erwarten genau das)
function fullFrame(changes) {
  const s = Object.assign({}, lastGood || last || {}, changes);
  const order = ['c', 'sf', 'st', 'mp', 'ms', 'mi', 'ca', 'dis', 'h', 's', 'p', 't'];
  const payload = order.map(k => k + (s[k] ?? '0')).join(',');
  return frame(payload);
}
// gleiche Zeile, aber Prüfsumme nach Formel B (Ziffern ohne s-Feld + 187)
function fullFrameB(changes) { return fullFrame(changes); }

function variants(payload) {
  return [
    frame(payload),                      // EE,x,cs,FF
    `EE,${payload},FF`,                  // ohne Prüfsumme
    payload,                             // roh
    payload + '\r\n',                    // roh mit Zeilenende
    `EE,${payload},${digitSum(payload)},FF`, // Prüfsumme ohne Offset
  ];
}

function candidates(mode) {
  const list = [];
  const add = arr => arr.forEach(x => { if (!list.includes(x)) list.push(x); });
  if (mode === 'start') {
    for (const c of [{ st: '30' }, { st: '20' }, { st: '30', p: '1.0' }, { st: '20', p: '1.0' }]) add([fullFrame(c), fullFrameB(c)]);
    for (const p of ['st30', 'st20', 'st1', 'st2', 'st3', 'start', 'START', 'Start', 'run', 'go', 'on',
                     'c1', 'sf1', 'k1', 'key1', 'b1', 'cmd1', 's1', 'p1.0', 'sp1.0', 'v1.0', 'spd1.0']) add(variants(p));
  } else if (mode === 'stop') {
    for (const c of [{ st: '10' }, { st: '10', p: '0.0' }]) add([fullFrame(c), fullFrameB(c)]);
    for (const p of ['st10', 'st0', 'stop', 'STOP', 'Stop', 'off', 'c0', 'k0', 'key0', 'b0', 'cmd0',
                     'p0.0', 'sp0.0', 'v0.0', 'pause', 'st40']) add(variants(p));
  } else if (mode === 'speed') {
    for (const c of [{ p: '2.0' }, { st: '20', p: '2.0' }]) add([fullFrame(c), fullFrameB(c)]);
    for (const p of ['p2.0', 'sp2.0', 'v2.0', 'spd2.0', 'speed2.0', 'p20', 'sp20', 'v20', 'up', 'UP', '+', 'k2', 'key2', 'b2']) add(variants(p));
  } else if (mode === 'binary') {
    // Binäre Protokolle anderer Laufband-Steuerungen (FitShow, KingSmith, FTMS-Control-Point)
    for (const [hex, note] of BINARY) list.push({ hex, note });
  } else if (mode === 'header') {
    // Andere Kopf-/Endkennungen als EE…FF (die App könnte z. B. mit AA… senden)
    for (const x of ['st20', 'st30', 'c1', 'p1.0']) {
      for (const H of ['AA', 'BB', 'CC', 'DD', 'FF', 'SS', 'ST', 'EF', 'FE', 'EA', 'AE', 'ES', 'CE'])
        add([`${H},${x},FF`, `${H},${x},${csReal([x])},FF`]);
      add([`EE,${x},EE`, `EE,${x},FF\r\n`, `EE${x}FF`, `EE,${x},${csReal([x])},FF\r\n`]);
    }
  } else if (mode === 'sweep') {
    // Prüfsumme durchprobieren: EE,<Eingabe>,0…399,FF
    const x = $('manual').value.trim() || 'st20';
    for (let n = 0; n < 256; n++) list.push(`EE,${x},${String(n).padStart(3, '0')},FF`);
  }
  return list;
}

const BINARY = [
  ['02 51 51 03', 'FitShow Status-Abfrage'],
  ['02 50 00 50 03', 'FitShow Geräteinfo'],
  ['02 53 01 52 03', 'FitShow Start'],
  ['02 53 02 0A 00 5B 03', 'FitShow Tempo 1.0'],
  ['02 53 02 14 00 45 03', 'FitShow Tempo 2.0'],
  ['02 53 03 50 03', 'FitShow Stopp'],
  ['F7 A2 02 01 A5 FD', 'KingSmith Modus manuell'],
  ['F7 A2 04 01 A7 FD', 'KingSmith Start'],
  ['F7 A2 01 14 B7 FD', 'KingSmith Tempo 2.0'],
  ['F7 A2 01 00 A3 FD', 'KingSmith Stopp'],
  ['00', 'FTMS Kontrolle anfordern'],
  ['07', 'FTMS Start'],
  ['02 C8 00', 'FTMS Tempo 2.0'],
  ['08 01', 'FTMS Stopp'],
  ['AA 01 01 55', 'generisch AA Start'],
  ['55 AA 01 01', 'generisch 55AA Start'],
  ['A5 01 A4', 'generisch A5 Start'],
  ['01', 'Byte 01'],
  ['02', 'Byte 02'],
];
const WAIT_MS = { sweep: 1200 };

// ---------- Automatischer Test ----------
const probe = { running: false, list: [], i: 0, mode: 'start' };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function reacted(before, extrasBefore) {
  if (extraMsgs.length > extrasBefore) return 'neue Antwort vom Band';
  if (!last || !before || hist.length < 2) return null;
  // Nur Änderungen zählen, die in den letzten zwei Meldungen gleich sind –
  // einzelne verstümmelte Meldungen (fehlende Zeichen) lösen sonst Fehlalarme aus.
  const a = hist[hist.length - 1], b = hist[hist.length - 2];
  const val = k => (a[k] === b[k] ? a[k] : before[k]);
  if (val('st') !== before.st) return `Zustand ${before.st} → ${val('st')}`;
  const p = parseFloat(val('p')), dp = p - parseFloat(before.p);
  if (probe.wasStopped && p > 0) return `Tempo ${before.p} → ${val('p')}`;
  if (!probe.wasStopped && Math.abs(dp) >= 0.3) return `Tempo ${before.p} → ${val('p')}`;
  for (const k of ['c', 'sf', 'mp', 'ms', 'mi', 'h', 's']) if (val(k) !== before[k]) return `Feld ${k}: ${before[k]} → ${val(k)}`;
  return null;
}

async function runProbe() {
  if (probe.running) return;
  const mode = $('probeMode').value;
  if (!last) { alert('Noch kein Status empfangen. Kurz warten.'); return; }
  if (mode === 'start' && last.st !== '10') { alert('Für den Start-Test muss das Band stehen.'); return; }
  if ((mode === 'stop' || mode === 'speed') && last.st === '10') { alert('Für diesen Test muss das Band laufen (per Fernbedienung starten).'); return; }
  if (probe.mode !== mode || probe.i >= probe.list.length || !probe.list.length) { probe.mode = mode; probe.list = candidates(mode); probe.i = 0; }
  const from = parseInt($('probeFrom').value, 10);
  if (from > 1 && probe.i === 0) probe.i = Math.min(from - 1, probe.list.length - 1);
  probe.wasStopped = last.st === '10';
  probe.running = true;
  log(`== Test "${mode}" ab Nr. ${probe.i + 1} von ${probe.list.length} (Band ${probe.wasStopped ? 'steht' : 'läuft'})`);
  const waitMs = WAIT_MS[mode] || 3000;
  while (probe.running && probe.i < probe.list.length) {
    const cmd = probe.list[probe.i];
    const label = typeof cmd === 'string' ? JSON.stringify(cmd) : `[hex] ${cmd.hex} (${cmd.note})`;
    $('probeInfo').textContent = `Nr. ${probe.i + 1}/${probe.list.length}: ${label}`;
    const before = Object.assign({}, last), extras = extraMsgs.length;
    if (typeof cmd === 'string') await sendText(cmd);
    else await sendBytes(new Uint8Array(cmd.hex.split(' ').map(h => parseInt(h, 16))), label);
    let why = null;
    for (let w = 0; w < waitMs / 300 && !why; w++) { await sleep(300); why = reacted(before, extras); }
    probe.i++;
    $('probeFrom').value = probe.i + 1;
    if (why) {
      probe.running = false;
      log(`** TREFFER bei Nr. ${probe.i}: ${label} → ${why}`);
      $('probeInfo').innerHTML = `<span class="hit">Treffer!</span> Nr. ${probe.i}: ${label.replace(/</g, '&lt;')}<br>${why}`;
      return;
    }
  }
  if (probe.i >= probe.list.length) {
    probe.running = false;
    log(`== Test "${mode}" durch, kein Treffer`);
    $('probeInfo').textContent = 'Alle Varianten durch – keine Reaktion.';
  }
}

// ---------- UI ----------
$('btnConnect').onclick = () => connect(false);
$('btnConnectAll').onclick = () => connect(true);
$('env').textContent = `Version 7 · Web Bluetooth: ${navigator.bluetooth ? 'verfügbar' : 'NICHT verfügbar'}`;
window.addEventListener('error', e => log('!! JS-Fehler: ' + e.message));
window.addEventListener('unhandledrejection', e => log('!! Fehler: ' + errStr(e.reason)));
$('btnDisconnect').onclick = () => { probe.running = false; device?.gatt?.disconnect(); };
$('btnProbe').onclick = runProbe;
$('btnProbePause').onclick = () => { probe.running = false; $('probeInfo').textContent += '  (pausiert)'; log('== pausiert'); };
$('probeMode').onchange = () => { probe.running = false; probe.i = 0; probe.list = []; $('probeFrom').value = 1; $('probeInfo').textContent = 'Bereit.'; };
$('btnSend').onclick = async () => {
  const v = $('manual').value.trim();
  if (!v) return;
  const mode = document.querySelector('input[name=wrap]:checked').value;
  if (mode === 'hex') {
    const bytes = new Uint8Array(v.replace(/[^0-9a-f]/gi, '').match(/../g).map(h => parseInt(h, 16)));
    await sendBytes(bytes, '[hex] ' + hexOf(bytes));
  } else {
    await sendText(mode === 'frame' ? frame(v) : v);
  }
};
$('btnCopy').onclick = async () => {
  const t = $('log').value;
  try { await navigator.clipboard.writeText(t); alert('Kopiert'); }
  catch { $('log').select(); document.execCommand('copy'); alert('Kopiert'); }
};
$('btnClear').onclick = () => { $('log').value = ''; };
</script>
</body>
</html>
